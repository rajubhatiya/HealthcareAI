server:
  port: 8080

spring:
  application:
    name: gateway-service
  main:
    web-application-type: reactive
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: retrieval-service
          uri: lb://retrieval-service
          predicates:
            - Path=/api/rag/**
          filters:
            # - AuthenticationFilter # Uncomment to enable strict auth
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                redis-rate-limiter.requestedTokens: 1
            - name: CircuitBreaker
              args:
                name: retrievalServiceBreaker
                fallbackUri: forward:/fallback
        - id: retrieval-service-health
          uri: lb://retrieval-service
          predicates:
            - Path=/api/v1/health/**

eureka:
  client:
    service-url:
      defaultZone: http://discovery-service:8761/eureka/

management:
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://zipkin:9411/api/v2/spans
  endpoints:
    web:
      exposure:
        include: health, info, prometheus

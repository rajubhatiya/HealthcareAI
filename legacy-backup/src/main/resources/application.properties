spring.application.name=healthcare
server.port=8080

spring.ai.chat.client.enabled=false
spring.ai.openai.api-key=${OPENAI_API_KEY:demo-key}
spring.ai.openai.organization-id=${OPENAI_ORG_KEY:demo-org}
spring.ai.openai.project-id=${OPENAI_PROJECT_ID:demo-project}
spring.ai.openai.chat.option.model=gpt-5.2
openai.api.url=https://api.openai.com/v1/chat/completions
openai.video.model=gpt-4o-mini-video
openai.video.duration=5s
openai.video.poll-attempts=60
openai.video.poll-delay-ms=3000



spring.ai.vertex.ai.gemini.project-id=${GEMINI_PROJECT_ID:demo-gemini-project}
spring.ai.vertex.ai.gemini.location=us-central1
spring.ai.vertex.chat.option.model=gemini-1.5-flash


# Database Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/healthcare}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver

# PGVector Configuration
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.dimension=1536
spring.ai.vectorstore.pgvector.initialize-schema=true
